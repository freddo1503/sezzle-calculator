# Serves the built interface and proxies the contract's /api prefix to the
# backend, stripping it, which is what the backend's root_path expects and what
# the Vite development server does with its rewrite. Same-origin on both paths,
# so the backend never needs cross-origin configuration. See architecture.md
# section 8.5.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # The trailing slash on proxy_pass is what strips the /api prefix.
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
